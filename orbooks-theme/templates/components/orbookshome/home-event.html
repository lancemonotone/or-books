<div class="blog-main-home blog-list">

        url="/news/"
        title=(lang 'common.home_news')
        title_class="sidebar-heading"
    }}
    <div class="blog-cont">
        {{#each blog.recent_posts }}
            {{> components/blog/post post=this theme_settings=../theme_settings show_tags=true}}
        {{/each}}
    </div>
</div>
