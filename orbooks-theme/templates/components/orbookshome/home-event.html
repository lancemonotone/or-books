<div class="blog-main-home blog-list or-listing or-section or-section--slider">
    {{> components/orbooks/section-head
        url="/news/"
        title=(lang 'common.home_news')
    }}
    <ul class="blog-cont">
        {{#each blog.recent_posts }}
            <li>
                {{> components/blog/post post=this theme_settings=../theme_settings}}
            </li>
        {{/each}}
    </ul>
</div>
