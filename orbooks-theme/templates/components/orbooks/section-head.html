{{!--
  Shared section head (design language).
  Plain title + See all link — identical for every section (slider or not).
  Title type: typography.scss (bare h*). Slider arrows stay on the carousel.
  Pass: title, url and/or category_id, cta.
--}}
<div class="or-section-head">
    <h2>{{title}}</h2>
    <div class="or-section-head-actions">
        <a
            class="or-section-head-cta button button--primary or-btn or-btn-sm"
            {{#if url}}href="{{url}}"
            {{else if category_id}}href="/categories.php?category={{category_id}}"
            {{else}}data-or-section-head-pending{{/if}}
        >{{#if cta}}{{cta}}{{else}}See all{{/if}}</a>
    </div>
</div>
